name: Bug report
description: Something is broken or wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: provider
    attributes:
      label: Which providers are configured? (e.g. yfinance, schwab, finnhub, mock)
  - type: textarea
    id: logs
    attributes:
      label: Backend terminal output / browser console error (redact any keys)
      render: text
  - type: input
    id: env
    attributes:
      label: OS + Python + Node versions
